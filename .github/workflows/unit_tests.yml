name: Unit Tests

on:
  push:
    branches:
      - '**'

jobs:
  unit_tests:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version:
          - "3.10"
          - "3.11"
          - "3.12"
          - "3.13"
          - "3.14"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Run unit test matrix entry
        uses: ./.github/actions/run-tests
        with:
          python-version: ${{ matrix.python-version }}
